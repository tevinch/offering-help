openapi: 3.1.0
info:
  title: Local catalog API
  version: 1.0.0
paths:
  /books/{id}:
    get:
      operationId: getBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: One book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
components:
  schemas:
    Book:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
