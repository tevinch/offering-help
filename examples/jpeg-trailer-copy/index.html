<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>JPEG trailer copy</title><style>body{font:17px/1.5 system-ui;max-width:680px;margin:60px auto;padding:0 24px;color:#16313a;background:#f4f8f7}label,button,a{display:block;margin:20px 0}button{padding:10px 18px}#status{white-space:pre-wrap}a[hidden]{display:none}</style><h1>Remove a JPEG trailer</h1><p>Choose a JPEG and save a separate copy without data after its end-of-image marker. Camera previews may be stored there. This does not remove ordinary EXIF metadata.</p><label>JPEG file <input id="file" type="file" accept="image/jpeg,.jpg,.jpeg"></label><label>Public API form <select id="form"><option value="tags">Empty-string tag</option><option value="args">Native args option</option></select></label><button id="remove" disabled>Prepare copy</button><p id="status" role="status">Choose a JPEG.</p><a id="download" hidden>Save copy</a><script type="module" src="/src/main.js"></script></html>
