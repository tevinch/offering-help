[package]
name = "schemars-field-contracts"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Directional and combined field descriptions with Schemars"

[dependencies]
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
jsonschema = { version = "=0.60.0", default-features = false }
